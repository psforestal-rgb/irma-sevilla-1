<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14306b">
  <title>Guía de inspección — Caso Irma Sevilla</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef1f6;color:#0e1319}
    .card{width:min(520px,100%);background:#fff;border:1px solid #b9c4d8;border-radius:14px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.10);text-align:center}
    h1{margin:0 0 10px;font-size:20px;color:#14306b}
    p{margin:7px 0;line-height:1.45}
    .spinner{width:38px;height:38px;margin:18px auto;border:4px solid #d8deea;border-top-color:#14306b;border-radius:50%;animation:spin .8s linear infinite}
    .error{display:none;text-align:left;background:#fff2f0;border:1px solid #e3aaa2;border-radius:10px;padding:12px;color:#7f160d;white-space:pre-wrap}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Guía de inspección — Caso Irma Sevilla</h1>
    <div id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando la guía de campo…</p>
    </div>
    <div id="error" class="error" role="alert"></div>
  </main>
  <script>
    (async function () {
      const parts = Array.from({length: 12}, (_, i) => `app/part_${String(i).padStart(2, "0")}.b64`);
      try {
        const decodedParts = [];
        let totalLength = 0;

        for (const path of parts) {
          const response = await fetch(path, {cache: "no-store"});
          if (!response.ok) throw new Error(`No se pudo cargar ${path} (${response.status}).`);

          const encodedPart = (await response.text()).replace(/\s+/g, "");
          const binaryPart = atob(encodedPart);
          decodedParts.push(binaryPart);
          totalLength += binaryPart.length;
        }

        const bytes = new Uint8Array(totalLength);
        let offset = 0;
        for (const binaryPart of decodedParts) {
          for (let i = 0; i < binaryPart.length; i++) {
            bytes[offset++] = binaryPart.charCodeAt(i);
          }
        }

        const html = new TextDecoder("utf-8").decode(bytes);
        if (!/^\s*<!doctype html>/i.test(html)) {
          throw new Error("El contenido reconstruido no es un documento HTML válido.");
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById("loading").style.display = "none";
        const box = document.getElementById("error");
        box.style.display = "block";
        box.textContent = "No fue posible cargar la guía. Recargue la página con conexión a internet.\n\nDetalle: " + error.message;
      }
    })();
  </script>
</body>
</html>
